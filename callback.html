<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neden Nokta - Yetkilendirme</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:0 auto;padding:40px 22px;color:#1E2240;background:#FFF8F1;line-height:1.6}
code{display:block;word-break:break-all;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin:12px 0}button{padding:10px 18px;border-radius:10px;border:0;background:#FF7A3D;color:#fff;font-weight:700}</style></head>
<body><h1>Neden Nokta Yayın</h1><div id="out"></div>
<script>
const p=new URLSearchParams(location.search), out=document.getElementById('out');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(p.get('code')){out.innerHTML='<p>Yetkilendirme kodu alındı. Bu kodu yalnızca Mac Terminal’deki betiğe yapıştır; kimseyle ve sohbetle paylaşma. Kod birkaç dakika içinde geçersiz olur.</p><code id="c">'+esc(p.get('code'))+'</code><button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'Kopyalandı\'">Kopyala</button>';}
else if(p.get('error')){out.innerHTML='<p>Yetkilendirme başarısız: '+esc(p.get('error'))+' '+esc(p.get('error_description')||'')+'</p>';}
else{out.innerHTML='<p>Bu sayfa Neden Nokta Yayın aracının yetkilendirme dönüş sayfasıdır.</p>';}
</script></body></html>
